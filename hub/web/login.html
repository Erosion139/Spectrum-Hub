<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectrum Hub</title>
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <form method="post" action="/login">
    <h1>Spectrum Hub</h1>
    <input type="password" name="password" placeholder="Password" autofocus>
    <button>Sign in</button>
    <p id="bad" hidden>Wrong password</p>
  </form>
  <script>if (location.search.includes('bad=1')) document.getElementById('bad').hidden = false</script>
</body>
</html>
